<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งรหัสผ่านใหม่ - Library Seat Booking</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1b2a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1b263b;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 350px;
        }
        h2 {
            text-align: center;
            color: #4ea8de;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #415a77;
            background-color: #0d1b2a;
            color: #ffffff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4ea8de;
            border: none;
            color: #b2fbff;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0b2670;
        }
        .back-link {
            text-align: center;
            margin-top: 15px;
        }
        .back-link a {
            color: #95d1e9;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>ตั้งรหัสผ่านใหม่</h2>
        <form id="resetForm">
            <div class="form-group">
    <label>รหัสนักศึกษา / อีเมล</label>
    <input type="text" id="student_id" placeholder="กรอกรหัสนักศึกษาหรืออีเมล" required 
           oninvalid="this.setCustomValidity('กรุณากรอกรหัสนักศึกษาหรืออีเมล')" 
           oninput="this.setCustomValidity('')">
        </div>
        <div class="form-group">
            <label>รหัสผ่านใหม่</label>
            <input type="password" id="new_password" placeholder="กรอกรหัสผ่านใหม่" required 
            oninvalid="this.setCustomValidity('กรุณากรอกรหัสผ่านใหม่')" 
            oninput="this.setCustomValidity('')">
        </div>
        <div class="form-group">
            <label>ยืนยันรหัสผ่านใหม่</label>
            <input type="password" id="confirm_password" placeholder="กรอกรหัสผ่านใหม่อีกครั้ง" required 
            oninvalid="this.setCustomValidity('กรุณายืนยันรหัสผ่านใหม่')" 
            oninput="this.setCustomValidity('')">
        </div>
        <button type="submit" id="submitBtn">บันทึกรหัสผ่านใหม่</button>
        </form>
        <div class="back-link">
            <a href="index.html">กลับไปหน้าเข้าสู่ระบบ</a>
        </div>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const student_id = document.getElementById('student_id').value;
            const new_password = document.getElementById('new_password').value;
            const confirm_password = document.getElementById('confirm_password').value;

            // เช็กว่ารหัสผ่านใหม่กับยืนยันรหัสผ่านตรงกันไหม
            if (new_password !== confirm_password) {
                alert('รหัสผ่านทั้งสองช่องไม่ตรงกัน กรุณาตรวจสอบอีกครั้ง');
                return;
            }

            // เช็กความยาวรหัสผ่าน (อย่างน้อย 6 ตัวอักษร)
            if (new_password.length < 8) {
                alert('รหัสผ่านต้องมีความยาวอย่างน้อย 8 ตัวอักษรขึ้นไป');
                return;
            }

            try {
                const response = await fetch('http://localhost:5000/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ student_id, new_password })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('เปลี่ยนรหัสผ่านสำเร็จ! กรุณาเข้าสู่ระบบด้วยรหัสใหม่');
                    window.location.href = 'index.html'; // เด้งกลับหน้า Login อัตโนมัติ
                } else {
                    alert('เกิดข้อผิดพลาด: ' + data.error);
                }
            } catch (err) {
                console.error(err);
                alert('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
            }
        });
    </script>

</body>
</html>
